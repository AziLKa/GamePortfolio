<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Skills page of Elizaveta Vdovicheva portfolio.">
  <title>Skills — Vdovicheva Elizaveta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/profile-book.css">
  <link rel="stylesheet" href="css/site-loader.css">
</head>
<body class="profile-page skills-page">
  <div class="profile-shell">
    <main class="profile-main">
      <section class="profile-screen" aria-labelledby="skills-title">
        <a class="profile-back" href="hello.html" aria-label="Back to Hello page">
          <img src="img/back-button.png" alt="Back" width="90" height="90">
        </a>

        <div class="book-stage">
          <img class="book-title" id="skills-title" src="img/title-skills.png" alt="SKILLS" width="764" height="122">
          <img class="book-base" src="img/book-image.png" alt="" aria-hidden="true" width="1559" height="1104">

          <div class="book-content skills-book-content">
            <div class="skills-layout" aria-label="Skills overview">
              <div class="skills-column">
                <article class="skill-card" style="--skill-value: 85;">
                  <img class="skill-card__icon" src="img/communication-button.png" alt="" aria-hidden="true" width="90" height="90">
                  <div class="skill-card__content">
                    <p class="skill-card__label">Communication</p>
                    <div class="skill-meter" aria-label="Communication 85 percent">
                      <span class="skill-meter__fill"></span>
                    </div>
                  </div>
                </article>

                <article class="skill-card" style="--skill-value: 95;">
                  <img class="skill-card__icon" src="img/adaptability-button.png" alt="" aria-hidden="true" width="90" height="90">
                  <div class="skill-card__content">
                    <p class="skill-card__label">Adaptability</p>
                    <div class="skill-meter" aria-label="Adaptability 95 percent">
                      <span class="skill-meter__fill"></span>
                    </div>
                  </div>
                </article>

                <article class="skill-card" style="--skill-value: 100;">
                  <img class="skill-card__icon" src="img/multitasking-button.png" alt="" aria-hidden="true" width="90" height="90">
                  <div class="skill-card__content">
                    <p class="skill-card__label">Multitasking</p>
                    <div class="skill-meter" aria-label="Multitasking 100 percent">
                      <span class="skill-meter__fill"></span>
                    </div>
                  </div>
                </article>

                <article class="skill-card" style="--skill-value: 95;">
                  <img class="skill-card__icon" src="img/creativity-button.png" alt="" aria-hidden="true" width="90" height="90">
                  <div class="skill-card__content">
                    <p class="skill-card__label">Creativity</p>
                    <div class="skill-meter" aria-label="Creativity 95 percent">
                      <span class="skill-meter__fill"></span>
                    </div>
                  </div>
                </article>
              </div>

              <div class="skills-column">
                <article class="skill-card" style="--skill-value: 75;">
                  <img class="skill-card__icon" src="img/dedication-button.png" alt="" aria-hidden="true" width="90" height="90">
                  <div class="skill-card__content">
                    <p class="skill-card__label">Dedication</p>
                    <div class="skill-meter" aria-label="Dedication 75 percent">
                      <span class="skill-meter__fill"></span>
                    </div>
                  </div>
                </article>

                <article class="skill-card" style="--skill-value: 5;">
                  <img class="skill-card__icon" src="img/Irresponsibility-button.png" alt="" aria-hidden="true" width="90" height="90">
                  <div class="skill-card__content">
                    <p class="skill-card__label">Irresponsibility</p>
                    <div class="skill-meter" aria-label="Irresponsibility 5 percent">
                      <span class="skill-meter__fill"></span>
                    </div>
                  </div>
                </article>

                <article class="skill-card" style="--skill-value: 100;">
                  <img class="skill-card__icon" src="img/enthusiam-button.png" alt="" aria-hidden="true" width="90" height="90">
                  <div class="skill-card__content">
                    <p class="skill-card__label">Enthusiam</p>
                    <div class="skill-meter" aria-label="Enthusiam 100 percent">
                      <span class="skill-meter__fill"></span>
                    </div>
                  </div>
                </article>

                <article class="skill-card" style="--skill-value: 100;">
                  <img class="skill-card__icon" src="img/player-button.png" alt="" aria-hidden="true" width="90" height="90">
                  <div class="skill-card__content">
                    <p class="skill-card__label">Player</p>
                    <div class="skill-meter" aria-label="Player 100 percent">
                      <span class="skill-meter__fill"></span>
                    </div>
                  </div>
                </article>
              </div>
            </div>
          </div>

          <nav class="book-tabs" aria-label="Resume section navigation">
            <a class="book-tab" href="start-the-game.html" aria-label="Open Start the Game page">
              <img src="img/start-button.png" alt="Start" width="281" height="83">
            </a>
            <a class="book-tab" href="resume.html" aria-label="Open resume page" data-skip-loader="true">
              <img src="img/resume-button.png" alt="Resume" width="281" height="83">
            </a>
            <span class="book-tab--active" aria-current="page">
              <img src="img/skills-button-used.png" alt="Skills" width="281" height="83">
            </span>
            <a class="book-tab" href="items.html" aria-label="Open items page" data-skip-loader="true">
              <img src="img/items-button.png" alt="Items" width="281" height="83">
            </a>
          </nav>
        </div>
      </section>
    </main>
  </div>
  <script src="js/site-loader.js"></script>
</body>
</html>
