<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Навигационная карта портфолио Елизаветы Вдовичевой.">
  <title>Navigation — Vdovicheva Elizaveta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/site-loader.css">
</head>
<body class="navigation-page">
  <div class="page-shell navigation-shell">
    <main class="navigation-main">
      <section class="navigation-screen" aria-labelledby="navigation-title">
        <img
          class="navigation-title-image"
          id="navigation-title"
          src="img/title-navigation.png"
          alt="NAVIGATION"
          width="848"
          height="104"
        >

        <div class="navigation-map" aria-label="Карта навигации по сайту">
          <img
            src="img/navigation-map.png"
            class="map-image"
            alt="Карта с маршрутами и точками перехода по сайту"
            width="2048"
            height="1365"
          >

          <a class="map-button map-button--game" href="hello.html" aria-label="Перейти на страницу Hello">
            <img src="img/game-button.png" alt="GAME" width="210" height="83">
          </a>

          <a class="map-button map-button--projects" href="project-platformer.html" aria-label="Перейти на страницу проекта Platformer">
            <img src="img/projects-button.png" alt="PROJECTS" width="264" height="83">
          </a>

          <a class="map-button map-button--resume" href="resume.html" aria-label="Перейти в раздел Resume">
            <img src="img/resume-button.png" alt="RESUME" width="210" height="83">
          </a>

          <a class="map-button map-button--contacts" href="contacts.html" aria-label="Перейти в раздел Contacts">
            <img src="img/contacts-button.png" alt="CONTACTS" width="278" height="83">
          </a>
        </div>
      </section>
    </main>
  </div>

  <script src="js/navigation.js"></script>
  <script src="js/site-loader.js"></script>
</body>
</html>
