<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Контакты Елизаветы Вдовичевой.">
  <title>Contacts — Vdovicheva Elizaveta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/contacts.css">
  <link rel="stylesheet" href="css/site-loader.css">
</head>
<body class="contacts-page">
  <div class="page-shell contacts-shell">
    <main class="contacts-main">
      <section class="contacts-screen" aria-labelledby="contacts-title">
        <img
          class="contacts-title-image"
          id="contacts-title"
          src="img/title-contacts.png"
          alt="CONTACTS"
          width="737"
          height="150"
        >

        <div class="contacts-card" aria-label="Контактная информация">
          <img
            class="contacts-card-image"
            src="img/contacts-image.png"
            alt="Контактная карточка с email, телефоном, Telegram и Instagram"
            width="913"
            height="571"
          >

          <a class="contact-button contact-button--email" href="mailto:VdovichevaElizaveta0104@mail.ru" aria-label="Написать на email">
            <img src="img/communication-button.png" alt="" aria-hidden="true" width="131" height="131">
          </a>

          <a class="contact-button contact-button--phone" href="tel:+79313771904" aria-label="Позвонить по телефону">
            <img src="img/creativity-button.png" alt="" aria-hidden="true" width="131" height="131">
          </a>

          <a class="contact-button contact-button--telegram" href="https://t.me/SgBigCat" target="_blank" rel="noopener noreferrer" aria-label="Открыть Telegram">
            <img src="img/adaptability-button.png" alt="" aria-hidden="true" width="131" height="131">
          </a>

          <a class="contact-button contact-button--instagram" href="https://www.instagram.com/SgBigCatty" target="_blank" rel="noopener noreferrer" aria-label="Открыть Instagram">
            <img src="img/multitasking-button.png" alt="" aria-hidden="true" width="131" height="131">
          </a>
        </div>

        <a class="navigation-return-button" href="navigation.html" aria-label="Вернуться на страницу навигации">
          <img src="img/navigation-button.png" alt="NAVIGATION" width="334" height="92">
        </a>
      </section>
    </main>
  </div>

  <script src="js/contacts.js"></script>
  <script src="js/site-loader.js"></script>
</body>
</html>
